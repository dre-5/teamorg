<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D-Jugend TSV Ratzenried</title>
<meta name="theme-color" content="#1B4B9B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #1B4B9B; font-family: system-ui, sans-serif; }
  /* Ladeanzeige, bis die App erscheint */
  .wait { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; text-align: center; }
  .wait img { width: 96px; height: 96px; animation: spin 1.6s linear infinite; }
  .wait p { margin: 14px 0 0; opacity: .9; }
  .wait a { color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .wait img { animation: none; } }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
</style>
</head>
<body>
  <div class="wait">
    <div>
      <img src="icon-192.png" alt="">
      <p>Teamplaner wird geladen …</p>
      <p id="help" hidden style="font-size:14px">Erscheint nichts? Bitte in Chrome bei Google anmelden<br>oder die <a id="direct" href="#" target="_blank" rel="noopener">App direkt öffnen</a>.</p>
    </div>
  </div>
  <iframe id="app" title="Teamplaner D-Jugend" allow="clipboard-write; screen-wake-lock; autoplay"></iframe>
<script>
  // >>> Hier die URL deiner Web-App eintragen (Bereitstellen → Bereitstellungen verwalten → Web-App-URL, endet auf /exec)
  const APP_URL = 'https://script.google.com/macros/s/AKfycbwEMQRY2TcmenqM5aqkRdH0JmburuH1HJ3yYkVW8UE1VOsRrOqEd5PFG07VOsMjm91IzA/exec';
  // <<<
  document.getElementById('app').src = APP_URL;
  document.getElementById('direct').href = APP_URL;
  setTimeout(() => { document.getElementById('help').hidden = false; }, 10000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
